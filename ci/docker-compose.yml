# ==============================================================================
# Lightweight, Cost-Optimized CI/CD Stack (Jenkins + SonarQube + PostgreSQL)
# Designed to run comfortably on a single t3.medium or t3.large instance (~4GB-8GB RAM)
# ==============================================================================

version: '3.8'

services:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. POSTGRESQL (Dedicated database for SonarQube)
  # ────────────────────────────────────────────────────────────────────────────
  sonarqube-db:
    image: postgres:15-alpine
    container_name: twindigital-sonarqube-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SONAR_DB_USER:-sonar}
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?SONAR_DB_PASSWORD environment variable must be set}
      POSTGRES_DB: ${SONAR_DB_NAME:-sonar}
    volumes:
      - sonarqube-db-data:/var/lib/postgresql/data
    networks:
      - ci-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONAR_DB_USER:-sonar}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ────────────────────────────────────────────────────────────────────────────
  # 2. SONARQUBE COMMUNITY (Memory-tuned to prevent Elasticsearch OOM)
  # ────────────────────────────────────────────────────────────────────────────
  sonarqube:
    image: sonarqube:10.4-community
    container_name: twindigital-sonarqube
    restart: unless-stopped
    depends_on:
      sonarqube-db:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_USERNAME=${SONAR_DB_USER:-sonar}
      - SONAR_JDBC_PASSWORD=${SONAR_DB_PASSWORD:?SONAR_DB_PASSWORD environment variable must be set}
      - SONAR_JDBC_URL=jdbc:postgresql://sonarqube-db:5432/${SONAR_DB_NAME:-sonar}
      # Cost-saving memory tuning for internal Elasticsearch and Web JVM:
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - SONAR_SEARCH_JAVAADDITIONALOPTS=-Xms512m -Xmx512m
      - SONAR_WEB_JAVAOPTS=-Xms512m -Xmx768m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    networks:
      - ci-network
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 1024M

  # ────────────────────────────────────────────────────────────────────────────
  # 3. JENKINS CONTROLLER (LTS JDK 17 with Host Docker Socket Integration)
  # ────────────────────────────────────────────────────────────────────────────
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: twindigital-jenkins
    restart: unless-stopped
    user: root # Needed to access mounted /var/run/docker.sock
    ports:
      - "8088:8080"   # Jenkins Web UI
      - "50000:50000" # Jenkins Inbound Agent port
    environment:
      - JAVA_OPTS=-Xms512m -Xmx1536m -Djenkins.install.runSetupWizard=false
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - jenkins-home:/var/jenkins_home
      # Share host Docker socket to build/scan without heavy Docker-in-Docker overhead:
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount host docker CLI binary if running on Linux:
      - /usr/bin/docker:/usr/bin/docker:ro
    networks:
      - ci-network
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 1024M

networks:
  ci-network:
    name: twindigital-ci-network
    driver: bridge

volumes:
  sonarqube-db-data:
    name: twindigital-sonarqube-db-data
  sonarqube-data:
    name: twindigital-sonarqube-data
  sonarqube-extensions:
    name: twindigital-sonarqube-extensions
  sonarqube-logs:
    name: twindigital-sonarqube-logs
  jenkins-home:
    name: twindigital-jenkins-home
