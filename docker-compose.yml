version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: twindigital-postgres
    environment:
      POSTGRES_DB: twindigital
      POSTGRES_USER: ${POSTGRES_USER:-twindigital}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-twindigital}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: twindigital-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: twindigital-auth
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/twindigital
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-twindigital}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      SERVER_PORT: 8081
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  cluster-sync-service:
    build:
      context: ./services/cluster-sync-service
      dockerfile: Dockerfile
    container_name: twindigital-cluster-sync
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/twindigital
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-twindigital}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KUBECONFIG_BASE64: ${KUBECONFIG_BASE64:-}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      EKS_CLUSTER_NAME: ${EKS_CLUSTER_NAME:-twindigital-cluster}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-30}
      SERVER_PORT: 8082
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  topology-service:
    build:
      context: ./services/topology-service
      dockerfile: Dockerfile
    container_name: twindigital-topology
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/twindigital
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-twindigital}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SERVER_PORT: 8083
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      cluster-sync-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  simulation-service:
    build:
      context: ./services/simulation-service
      dockerfile: Dockerfile
    container_name: twindigital-simulation
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/twindigital
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-twindigital}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      TOPOLOGY_SERVICE_URL: http://topology-service:8083
      COST_RISK_SERVICE_URL: http://cost-risk-service:8085
      SERVER_PORT: 8084
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      cluster-sync-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  cost-risk-service:
    build:
      context: ./services/cost-risk-service
      dockerfile: Dockerfile
    container_name: twindigital-cost-risk
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/twindigital
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-twindigital}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      SERVER_PORT: 8085
    depends_on:
      postgres:
        condition: service_healthy
      cluster-sync-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8085/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: twindigital-gateway
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: http://auth-service:8081
      CLUSTER_SYNC_SERVICE_URL: http://cluster-sync-service:8082
      TOPOLOGY_SERVICE_URL: http://topology-service:8083
      SIMULATION_SERVICE_URL: http://simulation-service:8084
      COST_RISK_SERVICE_URL: http://cost-risk-service:8085
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
