apiVersion: v1
kind: Service
metadata:
  name: cost-risk-service
  namespace: twindigital
  labels:
    app.kubernetes.io/name: cost-risk-service
    app.kubernetes.io/part-of: twindigital
    app.kubernetes.io/component: microservice
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8085"
    prometheus.io/path: "/actuator/prometheus"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cost-risk-service
  ports:
    - name: http
      port: 8085
      targetPort: http
      protocol: TCP
