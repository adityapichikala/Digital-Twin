apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: twindigital
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: twindigital
    app.kubernetes.io/component: api-gateway
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
