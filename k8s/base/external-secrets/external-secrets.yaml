# ==============================================================================
# ExternalSecrets syncing sensitive credentials from AWS Secrets Manager
# ==============================================================================

# 1. POSTGRESQL CREDENTIALS
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-credentials-sync
  namespace: twindigital
  labels:
    app.kubernetes.io/part-of: twindigital
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager-store
    kind: SecretStore
  target:
    name: postgres-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: twindigital/production/postgres
        property: username
    - secretKey: password
      remoteRef:
        key: twindigital/production/postgres
        property: password
    - secretKey: database
      remoteRef:
        key: twindigital/production/postgres
        property: database
    - secretKey: host
      remoteRef:
        key: twindigital/production/postgres
        property: host
    - secretKey: port
      remoteRef:
        key: twindigital/production/postgres
        property: port
---
# 2. JWT SECRETS (Tokens & Signature Keys)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: jwt-secrets-sync
  namespace: twindigital
  labels:
    app.kubernetes.io/part-of: twindigital
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager-store
    kind: SecretStore
  target:
    name: jwt-secrets
    creationPolicy: Owner
  data:
    - secretKey: jwt-secret
      remoteRef:
        key: twindigital/production/jwt
        property: secret
    - secretKey: expiration-ms
      remoteRef:
        key: twindigital/production/jwt
        property: expirationMs
---
# 3. REDIS CREDENTIALS
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: redis-credentials-sync
  namespace: twindigital
  labels:
    app.kubernetes.io/part-of: twindigital
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager-store
    kind: SecretStore
  target:
    name: redis-credentials
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: twindigital/production/redis
        property: password
    - secretKey: redis-url
      remoteRef:
        key: twindigital/production/redis
        property: url
