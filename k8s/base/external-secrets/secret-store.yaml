apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: twindigital
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/part-of: twindigital
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::112233445566:role/twindigital-external-secrets-irsa
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secretsmanager-store
  namespace: twindigital
  labels:
    app.kubernetes.io/part-of: twindigital
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
