# ==============================================================================
# Allow CoreDNS Egress NetworkPolicy
# Allows pods in twindigital to resolve DNS queries via kube-system CoreDNS.
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: twindigital
  labels:
    app.kubernetes.io/part-of: twindigital
    security.twindigital.io/policy: core-dns
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
