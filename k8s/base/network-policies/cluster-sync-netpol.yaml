# ==============================================================================
# NetworkPolicy for Cluster Sync Service
# Ingress: gateway (8082)
# Egress: Kubernetes API Server (port 443 / 6443) and PostgreSQL (5432)
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cluster-sync-service-netpol
  namespace: twindigital
  labels:
    app.kubernetes.io/name: cluster-sync-service
    app.kubernetes.io/part-of: twindigital
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cluster-sync-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
      ports:
        - protocol: TCP
          port: 8082
  egress:
    # 1. Egress to Kubernetes API Server on VPC CIDR (10.0.0.0/16) on port 443
    - to:
        - ipBlock:
            cidr: 10.0.0.0/16
      ports:
        - protocol: TCP
          port: 443
    # 2. Egress to PostgreSQL on RDS in the private subnets (port 5432)
    - to:
        - ipBlock:
            cidr: 10.0.10.0/23
        - ipBlock:
            cidr: 10.0.12.0/23
      ports:
        - protocol: TCP
          port: 5432
