# ==============================================================================
# NetworkPolicy for Frontend UI
# Ingress: Ingress-Nginx Controller (port 80)
# Egress: None (frontend static server needs no outbound connections)
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-netpol
  namespace: twindigital
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: twindigital
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: 80
  egress: []
