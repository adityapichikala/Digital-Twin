apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-ses-smtp
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager-ses-smtp
    app.kubernetes.io/part-of: twindigital
type: Opaque
# NOTE: Replace placeholder values with your actual base64-encoded AWS SES SMTP credentials.
# Or apply using:
#   kubectl create secret generic alertmanager-ses-smtp \
#     --namespace monitoring \
#     --from-literal=smtp-username='<SES_SMTP_USER>' \
#     --from-literal=smtp-password='<SES_SMTP_PASSWORD>' \
#     --from-literal=smtp-smarthost='email-smtp.ap-south-1.amazonaws.com:587' \
#     --from-literal=smtp-from='alerts@twindigital.io' \
#     --dry-run=client -o yaml | kubectl apply -f -
stringData:
  smtp-username: "AKIA_SES_SMTP_USERNAME_REPLACE_ME"
  smtp-password: "SES_SMTP_SECRET_PASSWORD_REPLACE_ME"
  smtp-smarthost: "email-smtp.ap-south-1.amazonaws.com:587"
  smtp-from: "alerts@twindigital.io"
