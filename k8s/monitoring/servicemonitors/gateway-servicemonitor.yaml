apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: twindigital-gateway-monitor
  namespace: monitoring
  labels:
    app.kubernetes.io/name: twindigital-gateway
    app.kubernetes.io/part-of: twindigital
    release: kube-prometheus-stack
spec:
  # Target services in twindigital and default namespaces
  namespaceSelector:
    matchNames:
      - default
      - twindigital
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: "(gateway_http_requests_total|gateway_http_request_duration_seconds.*|gateway_http_errors_total|nodejs_.*|process_.*)"
          action: keep
