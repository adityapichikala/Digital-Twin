apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: twindigital-auth-service-monitor
  namespace: monitoring
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: twindigital
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - default
      - twindigital
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-service
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
      scrapeTimeout: 10s
---
