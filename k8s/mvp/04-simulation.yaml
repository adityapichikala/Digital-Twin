# ── Simulation Deployment ─────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulation
  namespace: twindigital
  labels:
    app.kubernetes.io/name: simulation
    app.kubernetes.io/part-of: twindigital
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: simulation
  template:
    metadata:
      labels:
        app.kubernetes.io/name: simulation
        app.kubernetes.io/part-of: twindigital
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: simulation
          image: twindigital/simulation:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8084
              protocol: TCP
          env:
            - name: SERVER_PORT
              value: "8084"
            - name: CLUSTER_SYNC_SERVICE_URL
              value: "http://cluster-sync:8082"
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
# ── Simulation Service ────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: simulation
  namespace: twindigital
  labels:
    app.kubernetes.io/name: simulation
    app.kubernetes.io/part-of: twindigital
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8084
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: simulation
---
# ── Simulation HPA ────────────────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: simulation-hpa
  namespace: twindigital
  labels:
    app.kubernetes.io/name: simulation
    app.kubernetes.io/part-of: twindigital
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: simulation
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
