apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: twindigital-ingress
  namespace: twindigital
  labels:
    app.kubernetes.io/name: ingress
    app.kubernetes.io/part-of: twindigital
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # Route API traffic to Express Gateway (port 3000)
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 3000

          # Route UI static assets and SPA routes to Frontend (port 8080)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8080
