spring:
  application:
    name: cluster-sync-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/twindigital}
    username: ${SPRING_DATASOURCE_USERNAME:twindigital}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_cluster_sync

server:
  port: ${SERVER_PORT:8082}

cluster:
  sync:
    cluster-name: ${EKS_CLUSTER_NAME:twindigital-cluster}
    region: ${AWS_REGION:ap-south-1}
    kubeconfig-path: ${KUBECONFIG:}
    kubeconfig-base64: ${KUBECONFIG_BASE64:}
    stale-threshold-seconds: ${STALE_THRESHOLD_SECONDS:120}
    reconnect-initial-delay-seconds: ${RECONNECT_INITIAL_DELAY_SECONDS:1}
    reconnect-max-delay-seconds: ${RECONNECT_MAX_DELAY_SECONDS:60}
    reconnect-multiplier: ${RECONNECT_MULTIPLIER:2.0}
    auto-start: ${CLUSTER_SYNC_AUTO_START:true}
  eks:
    cluster-name: ${EKS_CLUSTER_NAME:twindigital-cluster}
    region: ${AWS_REGION:ap-south-1}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  structured:
    format:
      console: json
  level:
    root: INFO
    com.twindigital: DEBUG
