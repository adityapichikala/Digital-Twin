spring:
  application:
    name: cluster-sync-service-test
  datasource:
    url: jdbc:h2:mem:twindigital_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

cluster:
  sync:
    cluster-name: test-cluster
    auto-start: false
    stale-threshold-seconds: 60
