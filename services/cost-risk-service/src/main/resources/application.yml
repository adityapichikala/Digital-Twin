spring:
  application:
    name: cost-risk-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/twindigital}
    username: ${SPRING_DATASOURCE_USERNAME:twindigital}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_cost_risk

server:
  port: ${SERVER_PORT:8085}

aws:
  region: ${AWS_REGION:ap-south-1}
  cost-explorer:
    cache-ttl-minutes: ${COST_EXPLORER_CACHE_TTL_MINUTES:360}

services:
  prometheus:
    url: ${PROMETHEUS_URL:http://localhost:9090}

cost:
  default-hourly-node-cost: ${DEFAULT_HOURLY_NODE_COST:0.0416}
  monthly-hours: 730.0

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  structured:
    format:
      console: json
  level:
    root: INFO
    com.twindigital: DEBUG
