spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

aws:
  region: ap-south-1
  cost-explorer:
    cache-ttl-minutes: 60

services:
  prometheus:
    url: http://localhost:9090

cost:
  default-hourly-node-cost: 0.0416
  monthly-hours: 730.0

logging:
  level:
    root: WARN
    com.twindigital: INFO
